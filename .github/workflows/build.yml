name: Compile w3m and elinks for macOS (dynamic linking)
on: [push, workflow_dispatch]
jobs:
  build-w3m:
    runs-on: macos-15   # arm64 (Apple Silicon). Use macos-13 for Intel Macs instead.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        run: |
          brew install openssl ncurses gettext autoconf automake libtool pkg-config bdw-gc dylibbundler

      - name: Clone w3m source (active SourceHut fork)
        run: |
          git clone --depth 1 https://git.sr.ht/~rkta/w3m w3m-source

      - name: Configure and Compile w3m (dynamic linking)
        run: |
          cd w3m-source
          autoreconf -fiv

          export LDFLAGS="-L$(brew --prefix openssl)/lib -L$(brew --prefix ncurses)/lib -L$(brew --prefix gettext)/lib -L$(brew --prefix bdw-gc)/lib"
          export CPPFLAGS="-I$(brew --prefix openssl)/include -I$(brew --prefix ncurses)/include -I$(brew --prefix gettext)/include -I$(brew --prefix bdw-gc)/include"
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig"

          ./configure \
            --prefix="$GITHUB_WORKSPACE/w3m-bin" \
            --with-ssl="$(brew --prefix openssl)" \
            --with-gc="$(brew --prefix bdw-gc)" \
            --disable-nls

          make
          make install

      - name: Bundle dylibs alongside the binary
        run: |
          mkdir -p w3m-bin/bin/libs
          dylibbundler -od -b \
            -x w3m-bin/bin/w3m \
            -d w3m-bin/bin/libs \
            -p @executable_path/libs

      - name: Show linked libraries
        run: |
          otool -L w3m-bin/bin/w3m

      - name: Upload w3m artifact
        uses: actions/upload-artifact@v4
        with:
          name: w3m-macos-${{ github.run_id }}
          path: w3m-bin/

  build-elinks:
    runs-on: macos-15   # arm64 (Apple Silicon). Use macos-13 for Intel Macs instead.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        run: |
          brew install openssl ncurses gettext pkg-config meson ninja dylibbundler

      - name: Clone elinks source
        run: |
          git clone --depth 1 https://github.com/rkd77/elinks.git elinks-source

      - name: Configure and Compile elinks (dynamic linking)
        run: |
          cd elinks-source

          export LDFLAGS="-L$(brew --prefix openssl)/lib -L$(brew --prefix ncurses)/lib"
          export CPPFLAGS="-I$(brew --prefix openssl)/include -I$(brew --prefix ncurses)/include"
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig"

          meson setup build \
            --prefix="$GITHUB_WORKSPACE/elinks-bin" \
            --buildtype=release \
            -Dopenssl=true \
            -Dtre=false \
            -Dlibcss=false \
            -Dgpm=false \
            -Dapidoc=false \
            -Ddoc=false \
            -Dhtmldoc=false \
            -Dpdfdoc=false \
            -Didn=false \
            -Dnls=false

          ninja -C build
          ninja -C build install

      - name: Bundle dylibs alongside the binary
        run: |
          mkdir -p elinks-bin/bin/libs
          dylibbundler -od -b \
            -x elinks-bin/bin/elinks \
            -d elinks-bin/bin/libs \
            -p @executable_path/libs

      - name: Show linked libraries
        run: |
          otool -L elinks-bin/bin/elinks

      - name: Upload elinks artifact
        uses: actions/upload-artifact@v4
        with:
          name: elinks-macos-${{ github.run_id }}
          path: elinks-bin/
